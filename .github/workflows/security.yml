
name: DevSecOps Security Pipeline

on:
  push:
  pull_request:

jobs:
  security-gates:
    name: Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Gate 1 - Bandit SAST
        run: |
          bandit -r . -ll --exclude ./venv

      - name: Gate 2 - Safety Dependency Scan
        run: |
          safety scan --target requirements.txt

      - name: Gate 3 - Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2

      - name: Gate 4 - Custom AI Prompt Injection Scanner
        run: |
          python inject_scanner.py
